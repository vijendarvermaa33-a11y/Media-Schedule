name: Build Media Schedule App APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Media Schedule Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Android ZIP
        run: |
          ls -lah
          test -f AndroidApp.zip
          echo "AndroidApp.zip found."

      - name: Extract Android Project
        run: |
          rm -rf android-project
          mkdir -p android-project
          unzip -o AndroidApp.zip -d android-project
          echo "Project files:"
          find android-project -maxdepth 5 -type f | sort

      - name: Detect Project Directory
        id: detect
        shell: bash
        run: |
          SETTINGS=$(find android-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)
          test -n "$SETTINGS"
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJECT_DIR"

      - name: Verify Project
        run: |
          PROJECT="${{ steps.detect.outputs.project_dir }}"
          test -d "$PROJECT/app"
          test -f "$PROJECT/build.gradle" || test -f "$PROJECT/build.gradle.kts"
          test -f "$PROJECT/settings.gradle" || test -f "$PROJECT/settings.gradle.kts"
          test -f "$PROJECT/app/src/main/AndroidManifest.xml"
          echo "Project verification successful."

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK Packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build Debug APK
        working-directory: ${{ steps.detect.outputs.project_dir }}
        run: |
          gradle clean
          gradle assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p final-apk
          APK=$(find "${{ steps.detect.outputs.project_dir }}/app/build/outputs/apk/debug" -type f -name "*.apk" | head -1)
          test -n "$APK"
          cp "$APK" final-apk/Media-Schedule-App.apk
          ls -lh final-apk/Media-Schedule-App.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Media-Schedule-App-APK
          path: final-apk/Media-Schedule-App.apk
          if-no-files-found: error
          retention-days: 30
